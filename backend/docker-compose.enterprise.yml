version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: drug-platform-postgres
    environment:
      POSTGRES_DB: drug_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
    - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: drug-platform-redis
  api:
    build:
      context: .
    container_name: drug-platform-api
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
    - postgres
    - redis
    environment:
      APP_ENV: production
      DEBUG: 'false'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?SESSION_SIGNING_KEY is required}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  worker:
    build:
      context: .
    container_name: drug-platform-worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    depends_on:
    - postgres
    - redis
    environment:
      APP_ENV: production
      DEBUG: 'false'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?SESSION_SIGNING_KEY is required}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
volumes:
  postgres_data: null
